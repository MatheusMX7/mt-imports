<!DOCTYPE html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>Mateus Imports</title><style>
:root{--g:#1f6b3a;--g2:#154d2a;--bg:#fff;--fg:#10281a;--mu:#5a6f61;--cd:#f2f8f4;--bd:#d9e8de;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
 *{box-sizing:border-box}html,body{margin:0}body{background:var(--bg);color:var(--fg);font:15px/1.5 Inter,system-ui,sans-serif}
a{color:inherit;text-decoration:none}img{max-width:100%;display:block}button,input,select,textarea{font:inherit;color:inherit}
.w{max-width:1180px;margin:auto;padding:0 16px}header{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--g);border-bottom:0}
.hd{display:flex;align-items:center;gap:12px;padding:12px 0}.logo{font-weight:800;letter-spacing:.08em;color:#fff;font-size:18px;white-space:nowrap}.logo img{height:36px}
.hd form{flex:1}input,select,textarea{width:100%;padding:10px 12px;border:1px solid var(--bd);border-radius:10px;background:var(--bg)}
.btn{display:inline-block;background:var(--g);color:#fff;border:0;border-radius:10px;padding:11px 18px;font-weight:600;cursor:pointer;transition:transform .15s,filter .15s}.btn:hover{filter:brightness(1.1)}.btn:active{transform:scale(.97)}
.btn.o{background:none;color:var(--fg);border:1px solid var(--bd)}.btn.r{background:#b3261e}.btn.sm{padding:6px 10px;font-size:13px}
nav.cats{display:flex;gap:8px;overflow-x:auto;padding:0 0 10px}nav.cats a{padding:6px 14px;border:1px solid rgba(255,255,255,.4);color:#fff;border-radius:99px;white-space:nowrap;font-size:14px}nav.cats a:hover{background:#fff;color:var(--g)}
.hero{margin:20px 0;border-radius:18px;min-height:220px;padding:40px 32px;color:#fff;background:linear-gradient(135deg,var(--g2),var(--g)) center/cover;display:flex;flex-direction:column;justify-content:center;animation:up .7s both}
.hero h1{margin:0 0 8px;font-size:clamp(26px,5vw,44px)}h2{margin:28px 0 14px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:16px}
.card{border:1px solid var(--bd);border-radius:14px;overflow:hidden;background:var(--cd);transition:transform .25s,box-shadow .25s;animation:up .5s both}.card:hover{transform:translateY(-4px);box-shadow:0 10px 26px rgba(0,0,0,.12)}
.card .im{aspect-ratio:1;background:var(--bd);overflow:hidden}.card .im img{width:100%;height:100%;object-fit:cover;transition:transform .4s}.card:hover .im img{transform:scale(1.05)}.card .in{padding:12px}
.pr{font-weight:700}.old{color:var(--mu);text-decoration:line-through;font-weight:400;font-size:13px;margin-left:6px}.tag{font-size:12px;color:var(--g);font-weight:600}
.box{border:1px solid var(--bd);border-radius:14px;padding:16px;background:var(--cd);margin-bottom:14px}.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}.sp{flex:1}.mu{color:var(--mu);font-size:13px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}.pd{display:grid;grid-template-columns:1fr 1fr;gap:28px;margin-top:20px}
.th{display:flex;gap:8px;margin-top:8px}.th img{width:60px;height:60px;object-fit:cover;border-radius:8px;cursor:pointer;border:1px solid var(--bd)}
.steps{display:flex;gap:6px;margin:16px 0}.steps i{flex:1;height:5px;border-radius:9px;background:var(--bd)}.steps i.on{background:var(--g)}
label{display:block;font-size:13px;color:var(--mu);margin:8px 0 4px}.opt{display:flex;gap:10px;align-items:flex-start;border:1px solid var(--bd);border-radius:12px;padding:12px;margin-bottom:8px;cursor:pointer}.opt input{width:auto;margin-top:4px}
.err{color:#b3261e;font-size:13px}.ok{color:var(--g)}table{width:100%;border-collapse:collapse}td,th{padding:8px;border-bottom:1px solid var(--bd);text-align:left;font-size:14px}.ov{overflow-x:auto}
footer{margin-top:50px;padding:30px 0;border-top:1px solid var(--bd);color:var(--mu);font-size:14px}
#sp{position:fixed;inset:0;z-index:99;background:linear-gradient(135deg,var(--g2),var(--g));display:grid;place-items:center;color:#fff;transition:opacity .6s;cursor:pointer}
#sp div{font-size:clamp(28px,8vw,56px);font-weight:800;letter-spacing:.14em;animation:lg 1.6s ease both;background:linear-gradient(100deg,#fff 40%,#cfeedd 50%,#fff 60%) 0/250%;-webkit-background-clip:text;background-clip:text;color:transparent}
#sp img{height:90px;animation:lg 1.6s ease both}
@keyframes lg{from{opacity:0;transform:translateY(14px) scale(.9)}to{opacity:1;transform:none}}@keyframes up{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
.adm{display:grid;grid-template-columns:200px 1fr;gap:20px;margin-top:20px}.adm aside a{display:block;padding:9px 12px;border-radius:10px;cursor:pointer}.adm aside a.on{background:var(--g);color:#fff}
.kp{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:12px;margin-bottom:16px}.kp b{display:block;font-size:20px}
.bars{display:flex;align-items:flex-end;gap:6px;height:140px}.bars div{flex:1;background:var(--g);border-radius:5px 5px 0 0;min-height:2px;position:relative}.bars span{position:absolute;top:100%;left:0;right:0;text-align:center;font-size:10px;color:var(--mu)}
#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--g2);color:#fff;padding:10px 18px;border-radius:10px;z-index:100;display:none}
@media(max-width:760px){.pd,.two,.adm{grid-template-columns:1fr}.adm aside{display:flex;overflow-x:auto}.hero{padding:28px 20px}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
header .btn.o{background:#fff;color:var(--g);border:0}header input{border:0}footer{background:var(--g2);color:#e4f1e8;border:0}footer a,footer b{color:#fff}footer .mu{color:#bcd9c5}.btn.o:hover{border-color:var(--g);color:var(--g)}
.logo img{border-radius:8px;box-shadow:0 0 0 2px #fff}@media(max-width:760px){.grid{grid-template-columns:repeat(2,1fr);gap:10px}.card .in{padding:8px;font-size:13px}}
.hero-img{margin:20px 0;border-radius:18px;overflow:hidden;background:var(--g);animation:up .7s both}.hero-img img{width:100%;min-height:110px;object-fit:cover;display:block}

const save=()=>SV('mi_db',db),saveC=()=>SV('mi_cart',cart),uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const price=p=>p.promo>0&&p.promo<p.price?p.promo:p.price,num=v=>Math.max(0,parseFloat(String(v).replace(',','.'))||0);
function toast(m){const t=$('#toast');t.textContent=m;t.style.display='block';clearTimeout(t.h);t.h=setTimeout(()=>t.style.display='none',2600)}
const catName=id=>(db.cats.find(c=>c.id===id)||{}).name||'';
const sold=()=>{const m={};db.orders.filter(o=>o.st!=='Cancelado').forEach(o=>o.items.forEach(i=>m[i.pid]=(m[i.pid]||0)+i.qty));return m};
// splash
(()=>{const s=$('#sp'),rm=matchMedia('(prefers-reduced-motion:reduce)').matches;let seen=false;try{seen=sessionStorage.getItem('mi_sp')}catch(e){}
const x=()=>{s.style.opacity=0;setTimeout(()=>s.remove(),600)};if(seen||rm){s.remove();return}try{sessionStorage.setItem('mi_sp',1)}catch(e){}
if(db.s.logo)$('#spl').outerHTML='<img src="'+db.s.logo+'" alt="">';setTimeout(x,2400);s.onclick=x})();
// totals (recalculated from catalog prices, never from cart prices)
function cErr(cp,sub){if(!cp)return'Cupom inválido';if(!cp.on)return'Cupom inativo';if(cp.exp&&new Date(cp.exp+'T23:59:59')<new Date())return'Cupom expirado';if(cp.max&&cp.used>=cp.max)return'Cupom esgotado';if(sub<cp.min)return'Compra mínima de '+R(cp.min);return''}
function calc(code){const L=cart.map(c=>{const p=db.prods.find(x=>x.id===c.pid);return p&&p.active?{c,p,u:price(p),sub:Math.round(price(p)*c.qty*100)/100}:null}).filter(Boolean);
const sub=L.reduce((a,l)=>a+l.sub,0);let disc=0,err='',cp=null;if(code){cp=db.coupons.find(x=>x.code===code.trim().toUpperCase());err=cErr(cp,sub);if(err)cp=null;else disc=Math.min(sub,cp.type==='pct'?sub*cp.val/100:cp.val)}
disc=Math.round(disc*100)/100;const sh=ck&&ck.ship==='moto'?db.s.moto:ck&&ck.ship==='pickup'?0:null;return{L,sub,disc,err,cp,sh,total:sh==null?null:Math.max(0,Math.round((sub+sh-disc)*100)/100)}}
// views
const cardH=(p,i)=>`<a class="card" href="#p-${p.id}" style="animation-delay:${(i||0)*40}ms"><div class="im">${p.imgs[0]?`<img loading="lazy" src="${p.imgs[0]}" alt="${E(p.name)}">`:''}</div><div class="in"><div>${E(p.name)}</div><div class="pr">${R(price(p))}${price(p)<p.price?`<span class="old">${R(p.price)}</span>`:''}</div>${p.stock<1?'<div class="mu">Sem estoque</div>':''}</div></a>`;
const gridH=a=>a.length?`<div class="grid">${a.map(cardH).join('')}</div>`:'<p class="mu">Nenhum produto encontrado.</p>';
const vis=()=>db.prods.filter(p=>p.active&&(!p.cat||(db.cats.find(c=>c.id===p.cat)||{on:true}).on));
function head(){const s=db.s,n=cart.reduce((a,c)=>a+c.qty,0);return`<header><div class="w"><div class="hd"><a class="logo" href="#home">${s.logo?`<img src="${s.logo}" alt="${E(s.name)}">`:E(s.name.toUpperCase())}</a><form onsubmit="return go(this)"><input name="q" list="sg" placeholder="Pesquisar produtos" value="${E(q)}" aria-label="Pesquisar"><datalist id="sg">${vis().map(p=>`<option value="${E(p.name)}">`).join('')}</datalist></form><a class="btn o" href="#cart" aria-label="Carrinho">Carrinho (${n})</a></div><nav class="cats">${db.cats.filter(c=>c.on).sort((a,b)=>a.ord-b.ord).map(c=>`<a href="#c-${c.id}">${E(c.name)}</a>`).join('')}</nav></div></header>`}
function foot(){const s=db.s;return`<footer><div class="w"><b>${E(s.name)}</b><br>${E(s.addr)} ${s.hours?'· '+E(s.hours):''}<br>${s.wa?'WhatsApp: '+E(s.wa):''} ${s.insta?'· '+E(s.insta):''}</div></footer>`}
function go(f){q=f.q.value.trim();location.hash='search';render();return false}
function vHome(){const v=vis(),so=sold(),s=db.s;let h=`<div class="hero-img"><img src="${s.banner||BANNER}" alt="${E(s.name)}"></div>`;
if(!v.length)return h+'<div class="box">'+(loadErr?'Não foi possível carregar os produtos. Abra a loja pelo endereço do servidor (ex.: http://localhost:8000) e confirme que ele está rodando.':loaded?'Em breve novos produtos.':'Carregando…')+'</div>';
const sec=(t,a)=>a.length?`<h2>${t}</h2>`+gridH(a.slice(0,8)):'';
h+=sec('Ofertas especiais',v.filter(p=>price(p)<p.price))+sec('Novidades',[...v].sort((a,b)=>b.created-a.created))+sec('Mais vendidos',v.filter(p=>so[p.id]).sort((a,b)=>so[b.id]-so[a.id]));
db.cats.filter(c=>c.on).sort((a,b)=>a.ord-b.ord).forEach(c=>h+=sec(E(c.name),v.filter(p=>p.cat===c.id)));return h}
function vList(t,a){const o={new:'Novidades',lo:'Menor preço',hi:'Maior preço'};a=[...a].sort((x,y)=>sort==='lo'?price(x)-price(y):sort==='hi'?price(y)-price(x):y.created-x.created);
return`<div class="row"><h2 class="sp">${t}</h2><select style="width:auto" onchange="sort=this.value;render()">${Object.keys(o).map(k=>`<option value="${k}" ${sort===k?'selected':''}>${o[k]}</option>`).join('')}</select></div>${gridH(a)}`}
function vSearch(){const a=vis().filter(p=>p.name.toLowerCase().includes(q.toLowerCase()));return vList('Resultados para “'+E(q)+'”',a)+(a.length?'':'<p class="mu">Tente outro termo ou navegue pelas categorias.</p>')}
function vProd(id){const p=db.prods.find(x=>x.id===id);if(!p||!p.active)return'<p>Produto não encontrado.</p>';const im=p.imgs;
return`<a href="#home" class="mu">← Voltar</a><div class="pd"><div><div class="card"><div class="im">${im[gi]?`<img src="${im[gi]}" alt="${E(p.name)}">`:''}</div></div><div class="th">${im.map((m,i)=>`<img src="${m}" alt="" onclick="gi=${i};render()">`).join('')}</div></div><div><div class="tag">${E(catName(p.cat))}</div><h1 style="margin:4px 0">${E(p.name)}</h1><div class="pr" style="font-size:24px">${R(price(p))}${price(p)<p.price?`<span class="old">${R(p.price)}</span>`:''}</div><p>${E(p.desc)}</p>
${p.sizes.length?`<label>Tamanho / modelo</label><select id="vs"><option value="">Selecione</option>${p.sizes.map(x=>`<option>${E(x)}</option>`).join('')}</select>`:''}${p.colors.length?`<label>Cor</label><select id="vc"><option value="">Selecione</option>${p.colors.map(x=>`<option>${E(x)}</option>`).join('')}</select>`:''}
<label>Quantidade</label><input id="vq" type="number" min="1" value="1" style="width:100px"><p class="mu">${p.stock>0?p.stock+' em estoque':'Sem estoque'}</p><button class="btn" ${p.stock<1?'disabled':''} onclick="add('${p.id}')">Adicionar ao carrinho</button></div></div>`}
function add(id){const p=db.prods.find(x=>x.id===id),s=$('#vs')?$('#vs').value:'',c=$('#vc')?$('#vc').value:'',n=Math.max(1,parseInt($('#vq').value)||1);
if(p.sizes.length&&!s||p.colors.length&&!c)return toast('Selecione as variações obrigatórias');
const ex=cart.find(x=>x.pid===id&&x.s===s&&x.c===c),t=(ex?ex.qty:0)+n;if(t>p.stock)return toast('Estoque disponível: '+p.stock);
ex?ex.qty=t:cart.push({pid:id,s,c,qty:n});saveC();toast('Adicionado ao carrinho');render()}
function chq(i,d){const c=cart[i],p=db.prods.find(x=>x.id===c.pid);c.qty+=d;if(c.qty<1)cart.splice(i,1);else if(p&&c.qty>p.stock){c.qty=p.stock;toast('Limite de estoque')}saveC();render()}
const vr=c=>[c.s,c.c].filter(Boolean).join(' / ');
function lines(L,ctl){return L.map(l=>`<div class="box row"><div style="width:64px">${l.p.imgs[0]?`<img src="${l.p.imgs[0]}" alt="">`:''}</div><div class="sp"><b>${E(l.p.name)}</b><div class="mu">${E(vr(l.c))} · ${R(l.u)} un.</div></div>${ctl?`<button class="btn o sm" onclick="chq(${cart.indexOf(l.c)},-1)">−</button> ${l.c.qty} <button class="btn o sm" onclick="chq(${cart.indexOf(l.c)},1)">+</button> <button class="btn r sm" onclick="cart.splice(${cart.indexOf(l.c)},1);saveC();render()">Remover</button>`:`<span>${l.c.qty}×</span>`}<b>${R(l.sub)}</b></div>`).join('')}
function vCart(){ck=null;const c=calc('');if(!c.L.length)return'<h2>Carrinho</h2><p>Seu carrinho está vazio.</p><a class="btn" href="#home">Continuar comprando</a>';
return`<h2>Carrinho</h2>${lines(c.L,1)}<div class="box"><div class="row"><span class="sp">${c.L.reduce((a,l)=>a+l.c.qty,0)} item(ns)</span><b>${R(c.sub)}</b></div></div><div class="row"><a class="btn o" href="#home">Continuar comprando</a><a class="btn" href="#checkout" onclick="ck=null">Finalizar pedido</a></div>`}
// checkout
const SN=['Resumo','Entrega','Dados','Pagamento','Cupom','Confirmar'];
function vCk(){if(!cart.length)return vCart();if(!ck)ck={idem:uid()+uid(),st:1,ship:'',cep:'',cu:{},pay:'',pn:'',coupon:'',obs:''};const c=calc(ck.coupon),k=ck.st,u=ck.cu;if(ck.qr){if(ck.qr.err){c.err=ck.qr.err;c.cp=null;c.disc=0}else{c.err='';c.disc=+ck.qr.discount;c.sh=ck.qr.shipping==null?null:+ck.qr.shipping;c.total=ck.qr.total==null?null:+ck.qr.total;c.cp=ck.coupon?{code:ck.coupon.toUpperCase()}:null}}else{c.err='';c.disc=0;c.cp=null}
let b='';if(k===1)b=lines(c.L)+`<div class="box row"><span class="sp">Subtotal</span><b>${R(c.sub)}</b></div>`;
if(k===2)b=[['pickup','Retirada na loja','Sem custo. '+E(db.s.addr)+' '+E(db.s.pickup)],['moto','99Moto','Valor fixo: '+R(db.s.moto)],['correios','Correios','Valor do frete confirmado pelo atendimento via WhatsApp.'],['transp','Transportadora','Valor consultado e confirmado via WhatsApp.']].map(o=>`<label class="opt" style="color:var(--fg);font-size:15px;margin:0 0 8px"><input type="radio" name="sh" ${ck.ship===o[0]?'checked':''} onclick="ck.ship='${o[0]}';render()"><span><b>${o[1]}</b><br><span class="mu">${o[2]}</span></span></label>`).join('')+(ck.ship==='correios'||ck.ship==='transp'?`<label>CEP para consulta</label><input value="${E(ck.cep)}" oninput="ck.cep=this.value" placeholder="00000-000">`:'');
if(k===3)b='<div class="two">'+[['nome','Nome'],['sob','Sobrenome'],['tel','Celular com DDD'],['cep','CEP'],['end','Endereço'],['num','Número'],['comp','Complemento (opcional)'],['bai','Bairro'],['cid','Cidade'],['uf','Estado'],['ref','Referência (opcional)']].map(f=>`<div><label>${f[1]}</label><input value="${E(u[f[0]]||'')}" oninput="ck.cu.${f[0]}=this.value" ${f[0]==='cep'?'onblur="cepFill()"':''}></div>`).join('')+'</div>';
if(k===4)b=['PIX','Cartão de débito','Cartão de crédito','Dinheiro','Outros'].map(p=>`<label class="opt" style="color:var(--fg);font-size:15px;margin:0 0 8px"><input type="radio" name="pg" ${ck.pay===p?'checked':''} onclick="ck.pay='${p}';render()"><span><b>${p}</b>${p.startsWith('Cartão')?'<br><span class="mu">Seleção apenas informativa: o pagamento não é processado aqui.</span>':''}</span></label>`).join('')+(ck.pay==='PIX'?`<div class="box">${db.s.pix?'Chave PIX: <b>'+E(db.s.pix)+'</b><br>':''}${E(db.s.payInfo)}</div>`:'')+(ck.pay==='Dinheiro'||ck.pay==='Outros'?`<label>Observações (ex.: troco)</label><input value="${E(ck.pn)}" oninput="ck.pn=this.value">`:'');
if(k===5)b=`<label>Cupom de desconto (opcional)</label><div class="row"><input id="cpi" value="${E(ck.coupon)}" style="flex:1"><button class="btn" onclick="applyCp()">Aplicar</button></div>${ck.coupon?(c.err?`<p class="err">${c.err}</p>`:`<p class="ok">Cupom aplicado: -${R(c.disc)}</p>`):''}`;
if(k===6)b=`<div class="box"><b>${E((u.nome||'')+' '+(u.sob||''))}</b><br>${E(u.tel)} · ${E(u.end)}, ${E(u.num)} ${E(u.comp||'')} · ${E(u.bai)} · ${E(u.cid)}/${E(u.uf)} · ${E(u.cep)}</div>${lines(c.L)}<div class="box"><div class="row"><span class="sp">Subtotal</span>${R(c.sub)}</div><div class="row"><span class="sp">Cupom ${c.cp?E(c.cp.code):'—'}</span>-${R(c.disc)}</div><div class="row"><span class="sp">Entrega (${shN()})</span>${c.sh==null?'<i>a confirmar pelo WhatsApp</i>':R(c.sh)}</div><div class="row"><span class="sp">Pagamento</span>${E(ck.pay)}</div><div class="row"><b class="sp">TOTAL</b><b>${c.total==null?'Pendente (frete a confirmar)':R(c.total)}</b></div></div><label>Observações</label><textarea oninput="ck.obs=this.value">${E(ck.obs)}</textarea>`;
return`<h2>Finalizar pedido</h2><div class="steps">${SN.map((n,i)=>`<i class="${i<k?'on':''}" title="${n}"></i>`).join('')}</div><p class="mu">Etapa ${k} de 6 — ${SN[k-1]}</p>${b}<p class="err" id="ce"></p><div class="row">${k>1?'<button class="btn o" onclick="ck.st--;ck.qr=null;render()">Voltar</button>':'<a class="btn o" href="#cart">Carrinho</a>'}${k<6?'<button class="btn" onclick="nx()">Continuar</button>':`<button class="btn sp" ${busy?'disabled':''} onclick="place()">ENVIAR PEDIDO PELO WHATSAPP</button>`}</div>`}
const shN=()=>({pickup:'Retirada na loja',moto:'99Moto',correios:'Correios',transp:'Transportadora'}[ck.ship]||'');
async function cepFill(){const d=(ck.cu.cep||'').replace(/\D/g,'');if(d.length!==8)return;try{const r=await(await fetch('https://viacep.com.br/ws/'+d+'/json/')).json();if(!r.erro){Object.assign(ck.cu,{end:r.logradouro,bai:r.bairro,cid:r.localidade,uf:r.uf});render()}}catch(e){}}
function chk(k){const u=ck.cu;if(k===2&&!ck.ship)return'Escolha a forma de entrega';if(k===2&&/correios|transp/.test(ck.ship)&&(ck.cep||'').replace(/\D/g,'').length!==8)return'Informe um CEP válido';
if(k===3){for(const f of['nome','sob','tel','cep','end','num','bai','cid','uf'])if(!(u[f]||'').trim())return'Preencha todos os campos obrigatórios';if(u.tel.replace(/\D/g,'').length<10)return'Celular inválido (use DDD)';if(u.cep.replace(/\D/g,'').length!==8)return'CEP inválido'}
if(k===4&&!ck.pay)return'Escolha a forma de pagamento';return''}
async function nx(){const e=chk(ck.st);if(e)return $('#ce').textContent=e;if(ck.st===5)await quote();ck.st++;render()}
const pad=n=>String(n).padStart(6,'0');
// router
function render(){const h=location.hash.slice(1)||'home',[k,id]=[h.split('-')[0],h.slice(h.indexOf('-')+1)];let v;
if(k==='c'){const c=db.cats.find(x=>x.id===id);v=c?vList(E(c.name),vis().filter(p=>p.cat===id)):'<p>Categoria não encontrada.</p>'}
else if(k==='p')v=vProd(id);else if(h==='search')v=vSearch();else if(h==='cart')v=vCart();else if(h==='checkout')v=vCk();else if(k==='done')v=vDone(id);else v=vHome();
document.title=db.s.name;const y=scrollY;$('#app').innerHTML=head()+'<main class="w">'+(offline?'<div class="box" style="margin-top:12px">Sem conexão com o servidor: mostrando a última versão salva do catálogo. Pedidos só podem ser enviados quando a conexão voltar.</div>':'')+v+'</main>'+foot();if(document.activeElement===document.body)scrollTo(0,y)}
const body=()=>{const u=ck.cu;return{idem_key:ck.idem,customer:{nome:u.nome,sobrenome:u.sob,telefone:u.tel,cep:u.cep,endereco:u.end,numero:u.num,complemento:u.comp||'',bairro:u.bai,cidade:u.cid,estado:(u.uf||'').toUpperCase(),referencia:u.ref||''},items:cart.map(c=>({product_id:+c.pid.slice(1),size:c.s,color:c.c,qty:c.qty})),ship:ck.ship,cep:ck.cep||u.cep,pay:ck.pay,pay_note:ck.pn||'',notes:ck.obs||'',coupon:ck.coupon||''}};
const post=async(u)=>{const r=await fetch(u,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body())}),j=await r.json().catch(()=>({}));const d=j.detail;return{ok:r.ok,j,err:typeof d==='string'?d:(d&&d[0]&&d[0].msg)||'Verifique os dados do pedido'}};
async function quote(){try{const r=await post('/api/quote');ck.qr=r.ok?r.j:{err:r.err}}catch(e){ck.qr={err:'Falha de conexão'}}}
async function applyCp(){ck.coupon=$('#cpi').value.trim();await quote();render()}
async function place(){if(busy)return;for(let i=2;i<=4;i++){const e=chk(i);if(e)return $('#ce').textContent=e}busy=true;
try{const r=await post('/api/orders');busy=false;if(!r.ok){render();return $('#ce').textContent=r.err}doneInfo=r.j;cart=[];saveC();ck=null;window.open(doneInfo.wa_url,'_blank');location.hash='done'}catch(e){busy=false;render();$('#ce').textContent='Falha de conexão. Tente novamente.'}}
function vDone(){const j=doneInfo;if(!j)return'<p>Nenhum pedido recente.</p><a class="btn" href="#home">Voltar à loja</a>';return`<div class="box"><h2>Pedido #${pad(j.number)} registrado</h2><p>Status: <b>${E(j.status)}</b>. Para concluir, <b>confirme o envio da mensagem dentro do WhatsApp</b>. Ela não é enviada automaticamente.</p><a class="btn" target="_blank" rel="noopener" href="${j.wa_url}">Abrir WhatsApp novamente</a> <a class="btn o" href="#home">Voltar à loja</a></div>`}
function applyStore(r){const s=r.settings;db.s={...db.s,name:s.store_name,wa:s.whatsapp,addr:s.address,hours:s.hours,moto:+s.moto_fee,pix:s.pix_key,payInfo:s.pay_info,pickup:s.pickup_info,insta:s.socials,logo:s.logo_url||LOGO,banner:s.banner_url};
db.cats=r.categories.map((c,i)=>({id:'k'+c.id,name:c.name,desc:c.description,ord:i,on:true,img:c.image}));
db.prods=r.products.map(p=>({id:'p'+p.id,name:p.name,desc:p.description,price:+p.price,promo:+p.promo_price||0,cat:p.category_id?'k'+p.category_id:'',stock:p.stock,sizes:p.sizes,colors:p.colors,imgs:p.images,active:true,created:Date.parse(p.created_at)||0}))}
async function load(){const cache=ST('mi_catalog',null);if(cache&&cache.products){try{applyStore(cache);loaded=true;render()}catch(e){}}  // mostra a última cópia na hora, sem esperar o servidor
try{const res=await fetch('/api/store');if(!res.ok)throw 0;const r=await res.json();applyStore(r);offline=false;SV('mi_catalog',r)}
catch(e){if(cache&&cache.products){offline=true}else{loadErr=true;toast('Não foi possível carregar a loja')}}
cart=cart.filter(c=>db.prods.some(p=>p.id===c.pid));if(db.prods.length)saveC();loaded=true;render()}
addEventListener('hashchange',()=>{gi=0;render();scrollTo(0,0)});render();load();
</script></body></html>
