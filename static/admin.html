<!DOCTYPE html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="robots" content="noindex"><title>Admin — Mateus Imports</title><style>
:root{--g:#1f6b3a;--g2:#154d2a;--bg:#fff;--fg:#10281a;--mu:#5a6f61;--cd:#f2f8f4;--bd:#d9e8de;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
 *{box-sizing:border-box}html,body{margin:0}body{background:var(--bg);color:var(--fg);font:15px/1.5 Inter,system-ui,sans-serif}
a{color:inherit;text-decoration:none}img{max-width:100%;display:block}button,input,select,textarea{font:inherit;color:inherit}
.w{max-width:1180px;margin:auto;padding:0 16px}header{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--g);border-bottom:0}
.hd{display:flex;align-items:center;gap:12px;padding:12px 0}.logo{font-weight:800;letter-spacing:.08em;color:#fff;font-size:18px;white-space:nowrap}.logo img{height:36px}
.hd form{flex:1}input,select,textarea{width:100%;padding:10px 12px;border:1px solid var(--bd);border-radius:10px;background:var(--bg)}
.btn{display:inline-block;background:var(--g);color:#fff;border:0;border-radius:10px;padding:11px 18px;font-weight:600;cursor:pointer;transition:transform .15s,filter .15s}.btn:hover{filter:brightness(1.1)}.btn:active{transform:scale(.97)}
.btn.o{background:none;color:var(--fg);border:1px solid var(--bd)}.btn.r{background:#b3261e}.btn.sm{padding:6px 10px;font-size:13px}
nav.cats{display:flex;gap:8px;overflow-x:auto;padding:0 0 10px}nav.cats a{padding:6px 14px;border:1px solid rgba(255,255,255,.4);color:#fff;border-radius:99px;white-space:nowrap;font-size:14px}nav.cats a:hover{background:#fff;color:var(--g)}
.hero{margin:20px 0;border-radius:18px;min-height:220px;padding:40px 32px;color:#fff;background:linear-gradient(135deg,var(--g2),var(--g)) center/cover;display:flex;flex-direction:column;justify-content:center;animation:up .7s both}
.hero h1{margin:0 0 8px;font-size:clamp(26px,5vw,44px)}h2{margin:28px 0 14px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:16px}
.card{border:1px solid var(--bd);border-radius:14px;overflow:hidden;background:var(--cd);transition:transform .25s,box-shadow .25s;animation:up .5s both}.card:hover{transform:translateY(-4px);box-shadow:0 10px 26px rgba(0,0,0,.12)}
.card .im{aspect-ratio:1;background:var(--bd);overflow:hidden}.card .im img{width:100%;height:100%;object-fit:cover;transition:transform .4s}.card:hover .im img{transform:scale(1.05)}.card .in{padding:12px}
.pr{font-weight:700}.old{color:var(--mu);text-decoration:line-through;font-weight:400;font-size:13px;margin-left:6px}.tag{font-size:12px;color:var(--g);font-weight:600}
.box{border:1px solid var(--bd);border-radius:14px;padding:16px;background:var(--cd);margin-bottom:14px}.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}.sp{flex:1}.mu{color:var(--mu);font-size:13px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}.pd{display:grid;grid-template-columns:1fr 1fr;gap:28px;margin-top:20px}
.th{display:flex;gap:8px;margin-top:8px}.th img{width:60px;height:60px;object-fit:cover;border-radius:8px;cursor:pointer;border:1px solid var(--bd)}
.steps{display:flex;gap:6px;margin:16px 0}.steps i{flex:1;height:5px;border-radius:9px;background:var(--bd)}.steps i.on{background:var(--g)}
label{display:block;font-size:13px;color:var(--mu);margin:8px 0 4px}.opt{display:flex;gap:10px;align-items:flex-start;border:1px solid var(--bd);border-radius:12px;padding:12px;margin-bottom:8px;cursor:pointer}.opt input{width:auto;margin-top:4px}
.err{color:#b3261e;font-size:13px}.ok{color:var(--g)}table{width:100%;border-collapse:collapse}td,th{padding:8px;border-bottom:1px solid var(--bd);text-align:left;font-size:14px}.ov{overflow-x:auto}
footer{margin-top:50px;padding:30px 0;border-top:1px solid var(--bd);color:var(--mu);font-size:14px}
#sp{position:fixed;inset:0;z-index:99;background:linear-gradient(135deg,var(--g2),var(--g));display:grid;place-items:center;color:#fff;transition:opacity .6s;cursor:pointer}
#sp div{font-size:clamp(28px,8vw,56px);font-weight:800;letter-spacing:.14em;animation:lg 1.6s ease both;background:linear-gradient(100deg,#fff 40%,#cfeedd 50%,#fff 60%) 0/250%;-webkit-background-clip:text;background-clip:text;color:transparent}
#sp img{height:90px;animation:lg 1.6s ease both}
@keyframes lg{from{opacity:0;transform:translateY(14px) scale(.9)}to{opacity:1;transform:none}}@keyframes up{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
.adm{display:grid;grid-template-columns:200px 1fr;gap:20px;margin-top:20px}.adm aside a{display:block;padding:9px 12px;border-radius:10px;cursor:pointer}.adm aside a.on{background:var(--g);color:#fff}
.kp{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:12px;margin-bottom:16px}.kp b{display:block;font-size:20px}
.bars{display:flex;align-items:flex-end;gap:6px;height:140px}.bars div{flex:1;background:var(--g);border-radius:5px 5px 0 0;min-height:2px;position:relative}.bars span{position:absolute;top:100%;left:0;right:0;text-align:center;font-size:10px;color:var(--mu)}
#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--g2);color:#fff;padding:10px 18px;border-radius:10px;z-index:100;display:none}
@media(max-width:760px){.pd,.two,.adm{grid-template-columns:1fr}.adm aside{display:flex;overflow-x:auto}.hero{padding:28px 20px}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
header .btn.o{background:#fff;color:var(--g);border:0}header input{border:0}footer{background:var(--g2);color:#e4f1e8;border:0}footer a,footer b{color:#fff}footer .mu{color:#bcd9c5}.btn.o:hover{border-color:var(--g);color:var(--g)}
.logo img{border-radius:8px;box-shadow:0 0 0 2px #fff}@media(max-width:760px){.grid{grid-template-columns:repeat(2,1fr);gap:10px}.card .in{padding:8px;font-size:13px}}
.hero-img{margin:20px 0;border-radius:18px;overflow:hidden;background:var(--g);animation:up .7s both}.hero-img img{width:100%;min-height:110px;object-fit:cover;display:block}
</style></head><body><div id="app"></div><div id="toast"></div><script>
const $=s=>document.querySelector(s),E=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const R=n=>(+n||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'}),pad=n=>String(n).padStart(6,'0');
const STS=['Aguardando confirmação','Pedido confirmado','Em preparação','Saiu para entrega','Disponível para retirada','Concluído','Cancelado'];
let T=sessionStorage.getItem('t')||'',tab='dash',ed=null,yr=new Date().getFullYear(),q='',of={st:'',n:'',a:'',b:''},cur=null;
function toast(m){const t=$('#toast');t.textContent=m;t.style.display='block';clearTimeout(t.h);t.h=setTimeout(()=>t.style.display='none',2800)}
async function api(m,u,b){const r=await fetch('/api'+u,{method:m,headers:{'Content-Type':'application/json',...(T?{Authorization:'Bearer '+T}:{})},body:b?JSON.stringify(b):undefined});
if(r.status===401&&T){T='';sessionStorage.removeItem('t');boot();throw{detail:'Sessão expirada'}}
const j=await r.json().catch(()=>({}));if(!r.ok){const d=j.detail;toast(typeof d==='string'?d:(d&&d[0]&&d[0].msg)||'Erro ao salvar');throw j}return j}
const fimg=f=>new Promise(r=>{if(!f)return r('');const fr=new FileReader();fr.onload=()=>{const i=new Image();i.onload=()=>{const k=Math.min(1,900/Math.max(i.width,i.height)),c=document.createElement('canvas');c.width=i.width*k;c.height=i.height*k;c.getContext('2d').drawImage(i,0,0,c.width,c.height);r(c.toDataURL('image/jpeg',.75))};i.src=fr.result};fr.readAsDataURL(f)});
const inp=(n,l,v,t)=>`<div><label>${l}</label><input name="${n}" type="${t||'text'}" value="${E(v)}" ${t==='number'?'step="0.01" min="0"':''}></div>`;
const sel=(n,l,o,v)=>`<div><label>${l}</label><select name="${n}">${o.map(x=>`<option value="${x[0]}" ${String(x[0])===String(v)?'selected':''}>${E(x[1])}</option>`).join('')}</select></div>`;
const act=a=>sel('active','Status',[[1,'Ativo'],[0,'Inativo']],a?1:0);
const btns='<br><button class="btn">Salvar</button> <button type="button" class="btn o" onclick="ed=null;go()">Cancelar</button>';
const csv=s=>s.split(',').map(x=>x.trim()).filter(Boolean);
async function login(f){try{const j=await api('POST','/admin/login',{email:f.email.value,password:f.p.value});T=j.token;sessionStorage.setItem('t',T);boot()}catch(e){}return false}
const TABS={dash:'Dashboard',prods:'Produtos',cats:'Categorias',orders:'Pedidos',cup:'Cupons',cfg:'Configurações'};
function boot(){$('#app').innerHTML=T?`<header><div class="w"><div class="hd"><span class="logo">MATEUS IMPORTS · ADMIN</span><span class="sp"></span><a class="btn o" href="/" target="_blank">Ver loja</a> <button class="btn o" onclick="T='';sessionStorage.removeItem('t');boot()">Sair</button></div></div></header><main class="w"><div class="adm"><aside>${Object.keys(TABS).map(k=>`<a id="t-${k}" onclick="nav('${k}')">${TABS[k]}</a>`).join('')}</aside><section id="m"></section></div></main>`
:`<div class="box" style="max-width:380px;margin:60px auto"><h2>Login administrativo</h2><form onsubmit="login(this);return false"><label>E-mail</label><input name="email" type="email" autocomplete="username"><label>Senha</label><input name="p" type="password" autocomplete="current-password"><br><br><button class="btn">Entrar</button></form></div>`;if(T)go()}
const nav=k=>{tab=k;ed=null;go()};
async function go(){document.querySelectorAll('.adm aside a').forEach(a=>a.classList.toggle('on',a.id==='t-'+tab));$('#m').innerHTML='<p class="mu">Carregando…</p>';try{$('#m').innerHTML=await V[tab]()}catch(e){$('#m').innerHTML='<p class="err">Não foi possível carregar.</p>'}}
async function del(u){if(!confirm('Remover definitivamente? Se só quer esconder da loja, use o status Inativo em vez de remover.'))return;try{await api('DELETE',u)}catch(e){if(e&&typeof e.detail==='string'&&e.detail.includes('force')&&confirm(e.detail+' Excluir mesmo assim?'))try{await api('DELETE',u+'?force=true')}catch(_){}}go()}
async function save(m,u,b){try{await api(m,u,b);ed=null;toast('Salvo');go()}catch(e){}}
const V={};
V.dash=async()=>{const d=await api('GET','/admin/dashboard?year='+yr),y0=new Date().getFullYear(),k=(l,v)=>`<div class="box"><span class="mu">${l}</span><b>${v}</b></div>`,bar=(a,f)=>{const m=Math.max(...a,1);return`<div class="bars" style="margin:14px 0 22px">${a.map((v,i)=>`<div style="height:${v/m*100}%" title="${f(v)}"><span>${i+1}</span></div>`).join('')}</div>`};
return`<div class="kp">${k('Faturamento do mês',R(d.month))}${k('Mês anterior',R(d.prev_month))}${k('Faturamento do ano',R(d.year))}${k('Ano anterior',R(d.prev_year))}${k('Total de pedidos',d.orders)}${k('Ticket médio',R(d.ticket))}${k('Pendentes',d.pending)}${k('Concluídos',d.completed)}${k('Produtos',d.products)}${k('Categorias',d.categories)}${k('Disponíveis',d.available)}${k('Sem estoque',d.out_of_stock)}</div><p class="mu">Faturamento considera apenas pedidos Concluídos; cancelados ficam fora.</p>
<div class="box"><div class="row"><b class="sp">Ano</b><select style="width:auto" onchange="yr=+this.value;go()">${[0,1,2,3].map(i=>`<option ${y0-i===yr?'selected':''}>${y0-i}</option>`).join('')}</select></div><b>Faturamento por mês</b>${bar(d.monthly,R)}<b>Pedidos por mês</b>${bar(d.orders_by_month,x=>x)}</div>
<div class="two"><div class="box"><b>Mais vendidos</b>${d.top_products.map(t=>`<div class="row"><span class="sp">${E(t[0])}</span>${t[1]}</div>`).join('')||'<p class="mu">Sem vendas.</p>'}</div><div class="box"><b>Vendas por categoria</b>${d.sales_by_category.map(t=>`<div class="row"><span class="sp">${E(t.category)}</span>${R(t.total)}</div>`).join('')||'<p class="mu">Sem vendas.</p>'}</div></div>`};
V.prods=async()=>{if(ed){const cs=await api('GET','/admin/categories'),p=ed==='new'?{name:'',description:'',price:'',promo_price:'',category_id:'',stock:0,sizes:[],colors:[],active:true,images:[]}:(await api('GET','/admin/products')).find(x=>x.id===ed);
return`<h3>${ed==='new'?'Novo produto':'Editar produto'}</h3><form onsubmit="sP(this);return false"><div class="two">${inp('name','Nome',p.name)}${sel('cat','Categoria',[['','—'],...cs.map(c=>[c.id,c.name])],p.category_id||'')}${inp('price','Preço (R$)',p.price,'number')}${inp('promo','Preço promocional (opcional)',p.promo_price||'','number')}${inp('stock','Estoque',p.stock,'number')}${act(p.active)}${inp('sizes','Tamanhos/modelos (separe por vírgula)',p.sizes.join(', '))}${inp('colors','Cores (separe por vírgula)',p.colors.join(', '))}</div><label>Descrição</label><textarea name="description">${E(p.description)}</textarea><label>Imagens (${p.images.length} atual(is); enviar novas substitui)</label><input type="file" name="im" accept="image/*" multiple>${btns}</form>`}
const ps=await api('GET','/admin/products?q='+encodeURIComponent(q));return`<div class="row"><h3 class="sp">Produtos (${ps.length})</h3><input style="width:200px" placeholder="Buscar" value="${E(q)}" onchange="q=this.value;go()"><button class="btn" onclick="ed='new';go()">+ Produto</button></div><div class="ov"><table><tr><th>Nome</th><th>Preço</th><th>Estoque</th><th>Status</th><th></th></tr>${ps.map(p=>`<tr><td>${E(p.name)}</td><td>${R(p.promo_price||p.price)}</td><td>${p.stock}</td><td>${p.active?'Ativo':'Inativo'}</td><td><button class="btn o sm" onclick="ed=${p.id};go()">Editar</button> <button class="btn r sm" onclick="del('/admin/products/${p.id}')">Remover</button></td></tr>`).join('')||'<tr><td class="mu">Nenhum produto.</td></tr>'}</table></div>`};
async function sP(f){const g=n=>f[n].value.trim(),ims=await Promise.all([...f.im.files].map(fimg)),b={name:g('name'),description:g('description'),price:+g('price'),promo_price:g('promo')?+g('promo'):null,category_id:f.cat.value?+f.cat.value:null,stock:parseInt(f.stock.value)||0,sizes:csv(g('sizes')),colors:csv(g('colors')),active:f.active.value==='1'};if(ims.length)b.images=ims;save(ed==='new'?'POST':'PUT','/admin/products'+(ed==='new'?'':'/'+ed),b)}
V.cats=async()=>{const cs=await api('GET','/admin/categories');if(ed){cur=ed==='new'?{name:'',description:'',image:'',sort_order:cs.length+1,active:true}:cs.find(x=>x.id===ed);return`<h3>Categoria</h3><form onsubmit="sC(this);return false"><div class="two">${inp('name','Nome',cur.name)}${inp('ord','Ordem de exibição',cur.sort_order,'number')}${act(cur.active)}<div><label>Imagem (opcional)</label><input type="file" name="im" accept="image/*"></div></div><label>Descrição</label><textarea name="description">${E(cur.description)}</textarea>${btns}</form>`}
return`<div class="row"><h3 class="sp">Categorias</h3><button class="btn" onclick="ed='new';go()">+ Categoria</button></div><div class="ov"><table>${cs.map(c=>`<tr><td>${c.sort_order}. ${E(c.name)}</td><td>${c.active?'Ativa':'Inativa'}</td><td><button class="btn o sm" onclick="ed=${c.id};go()">Editar</button> <button class="btn r sm" onclick="del('/admin/categories/${c.id}')">Remover</button></td></tr>`).join('')||'<tr><td class="mu">Nenhuma categoria.</td></tr>'}</table></div>`};
async function sC(f){const im=await fimg(f.im.files[0]);save(ed==='new'?'POST':'PUT','/admin/categories'+(ed==='new'?'':'/'+ed),{name:f.name.value.trim(),description:f.description.value,image:im||cur.image,sort_order:parseInt(f.ord.value)||0,active:f.active.value==='1'})}
async function pa(id,b){try{await api('PATCH','/admin/orders/'+id,b);toast('Atualizado')}catch(e){}go()}
V.orders=async()=>{if(ed){const o=await api('GET','/admin/orders/'+ed),c=o.customer;return`<button class="btn o sm" onclick="ed=null;go()">← Voltar</button><h3>Pedido #${pad(o.number)} · ${new Date(o.date).toLocaleString('pt-BR')}</h3><div class="box">${E(c.nome)} ${E(c.sobrenome)} · ${E(c.telefone)}<br>${E(c.endereco)}, ${E(c.numero)} ${E(c.complemento)} · ${E(c.bairro)} · ${E(c.cidade)}/${E(c.estado)} · ${E(c.cep)}<br>Entrega: ${o.ship} · Pagamento: ${E(o.pay)} ${E(o.pay_note)}${o.notes?'<br>Obs.: '+E(o.notes):''}</div><div class="ov"><table>${o.items.map(i=>`<tr><td>${E(i.name)} <span class="mu">${E(i.variation)}</span></td><td>${i.qty}×</td><td>${R(i.subtotal)}</td></tr>`).join('')}</table></div><p>Subtotal ${R(o.subtotal)} · Desconto ${R(o.discount)} ${o.coupon?'('+E(o.coupon)+')':''} · Frete ${o.shipping==null?'a confirmar':R(o.shipping)} · <b>Total ${o.total==null?'pendente':R(o.total)}</b></p><label>Status</label><select onchange="pa(${o.number},{status:this.value})">${STS.map(s=>`<option ${s===o.status?'selected':''}>${s}</option>`).join('')}</select><label>Frete confirmado (R$) — Correios/Transportadora</label><input type="number" step="0.01" min="0" value="${o.shipping==null?'':o.shipping}" onchange="pa(${o.number},{shipping:this.value===''?null:+this.value})"><label>Observações internas</label><textarea onchange="pa(${o.number},{internal_note:this.value})">${E(o.internal_note)}</textarea>`}
const p=new URLSearchParams();if(of.st)p.set('status',of.st);if(of.n)p.set('number',of.n);if(of.a)p.set('date_from',of.a);if(of.b)p.set('date_to',of.b);const l=await api('GET','/admin/orders?'+p);
return`<h3>Pedidos</h3><div class="row"><select style="width:auto" onchange="of.st=this.value;go()"><option value="">Todos os status</option>${STS.map(s=>`<option ${s===of.st?'selected':''}>${s}</option>`).join('')}</select><input style="width:110px" placeholder="Nº" value="${E(of.n)}" onchange="of.n=this.value;go()"><input type="date" style="width:auto" value="${of.a}" onchange="of.a=this.value;go()"><input type="date" style="width:auto" value="${of.b}" onchange="of.b=this.value;go()"></div><div class="ov"><table><tr><th>Nº</th><th>Cliente</th><th>Data</th><th>Total</th><th>Status</th><th></th></tr>${l.map(o=>`<tr><td>#${pad(o.number)}</td><td>${E(o.customer.nome)}<div class="mu">${E(o.customer.telefone)}</div></td><td>${new Date(o.date).toLocaleDateString('pt-BR')}</td><td>${o.total==null?'pendente':R(o.total)}</td><td>${o.status}</td><td><button class="btn o sm" onclick="ed=${o.number};go()">Abrir</button></td></tr>`).join('')||'<tr><td class="mu">Nenhum pedido.</td></tr>'}</table></div>`};
V.cup=async()=>{const cs=await api('GET','/admin/coupons');if(ed){cur=ed==='new'?{code:'',kind:'percent',value:'',expires_on:'',max_uses:'',min_purchase:0,active:true}:cs.find(x=>x.id===ed);return`<h3>Cupom</h3><form onsubmit="sU(this);return false"><div class="two">${inp('code','Código',cur.code)}${sel('kind','Tipo',[['percent','Percentual (%)'],['fixed','Valor fixo (R$)']],cur.kind)}${inp('value','Valor',cur.value,'number')}${inp('exp','Validade',cur.expires_on||'','date')}${inp('max','Máx. de usos (vazio = ilimitado)',cur.max_uses||'','number')}${inp('min','Compra mínima (R$)',cur.min_purchase,'number')}${act(cur.active)}</div>${btns}</form>`}
return`<div class="row"><h3 class="sp">Cupons</h3><button class="btn" onclick="ed='new';go()">+ Cupom</button></div><div class="ov"><table>${cs.map(c=>`<tr><td>${E(c.code)}</td><td>${c.kind==='percent'?c.value+'%':R(c.value)}</td><td>${c.used_count}/${c.max_uses||'∞'}</td><td>${c.active?'Ativo':'Inativo'}</td><td><button class="btn o sm" onclick="ed=${c.id};go()">Editar</button> <button class="btn r sm" onclick="del('/admin/coupons/${c.id}')">Remover</button></td></tr>`).join('')||'<tr><td class="mu">Nenhum cupom.</td></tr>'}</table></div>`};
function sU(f){save(ed==='new'?'POST':'PUT','/admin/coupons'+(ed==='new'?'':'/'+ed),{code:f.code.value.trim(),kind:f.kind.value,value:+f.value.value,expires_on:f.exp.value||null,max_uses:+f.max.value||null,min_purchase:+f.min.value||0,active:f.active.value==='1'})}
V.cfg=async()=>{cur=await api('GET','/admin/settings');const s=cur;return`<h3>Configurações da loja</h3><form onsubmit="sS(this);return false"><div class="two">${inp('store_name','Nome da loja',s.store_name)}${inp('whatsapp','WhatsApp (com DDI, ex.: 5587999999999)',s.whatsapp)}${inp('address','Endereço',s.address)}${inp('hours','Horário de funcionamento',s.hours)}${inp('moto_fee','Valor fixo 99Moto (R$)',s.moto_fee,'number')}${inp('pix_key','Chave PIX',s.pix_key)}${inp('socials','Redes sociais',s.socials)}${inp('pickup_info','Informações de retirada',s.pickup_info)}</div><label>Instruções de pagamento</label><textarea name="pay_info">${E(s.pay_info)}</textarea><div class="two"><div><label>Logo (opcional)</label><input type="file" name="logo" accept="image/*"></div><div><label>Banner principal (opcional)</label><input type="file" name="banner" accept="image/*"></div></div><br><button class="btn">Salvar</button></form>`};
async function sS(f){const b={};for(const k of['store_name','whatsapp','address','hours','pix_key','socials','pickup_info','pay_info'])b[k]=f[k].value.trim();b.moto_fee=+f.moto_fee.value||0;b.logo_url=await fimg(f.logo.files[0])||cur.logo_url;b.banner_url=await fimg(f.banner.files[0])||cur.banner_url;try{await api('PUT','/admin/settings',b);toast('Configurações salvas')}catch(e){}}
boot();
</script></body></html>
